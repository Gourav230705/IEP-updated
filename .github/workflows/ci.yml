name: CI Demo

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx eslint src || true

      - run: npm run build || true

      - run: echo "Workflow completed successfully."
