version: '3.8'

services:
  # Backend Service (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Frontend Service (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
